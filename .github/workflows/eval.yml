name: Evaluation

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Fetch Pyodide
        run: node scripts/fetch-pyodide.mjs

      - name: Short eval
        run: npm run eval:ci
